<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free classrooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>Free classrooms</h1>
    <div class="hero" aria-live="polite">
      <span class="hero-count" id="free-count">–</span>
      <span class="hero-text" id="hero-text">Checking the rooms…</span>
    </div>
    <p class="meta" id="meta"></p>
  </header>

  <p class="banner" id="banner" role="alert" hidden></p>

  <section class="controls" aria-label="Filter rooms">
    <div class="seg" role="group" aria-label="Show rooms that are">
      <button type="button" data-status="" aria-pressed="true">All</button>
      <button type="button" data-status="free" aria-pressed="false">Free</button>
      <button type="button" data-status="occupied" aria-pressed="false">Occupied</button>
    </div>
    <label class="select">
      <span>Building</span>
      <select id="building"><option value="">All buildings</option></select>
    </label>
  </section>

  <main id="rooms"></main>

  <footer class="foot">
    <p>A room is free when the camera counts 7 students or fewer, and occupied when it counts more than 7. A room with no camera signal shows as no signal, never as free.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
